name: Deploy portfolio to Timeweb

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portfolio
        run: npm run build

      - name: Check Timeweb destination
        id: destination
        env:
          TIMEWEB_FTP_DIR: ${{ vars.TIMEWEB_FTP_DIR }}
        run: |
          if [ -z "$TIMEWEB_FTP_DIR" ]; then
            echo "::error::Set the repository variable TIMEWEB_FTP_DIR to the website root directory on Timeweb."
            exit 1
          fi
          printf 'remote_dir=%s/\n' "${TIMEWEB_FTP_DIR%/}" >> "$GITHUB_OUTPUT"

      - name: Install traceroute for network diagnostics
        run: |
          sudo apt-get update
          sudo apt-get install -y traceroute

      - name: Trace route to Timeweb IP
        run: |
          echo "=== Runner public IP ==="
          curl -4 -s https://api.ipify.org
          echo
          echo "=== ICMP traceroute ==="
          sudo traceroute -4 -n -I -q 3 -w 2 -m 30 92.53.96.150 || true
          echo "=== TCP traceroute (port 21) ==="
          sudo traceroute -4 -n -T -p 21 -q 3 -w 2 -m 30 92.53.96.150 || true

      - name: Deploy dist to Timeweb over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: 92.53.96.150
          username: ${{ secrets.TIMEWEB_FTP_USERNAME }}
          password: ${{ secrets.TIMEWEB_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: dist/
          server-dir: ${{ steps.destination.outputs.remote_dir }}
          dry-run: false
