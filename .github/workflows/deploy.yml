name: Deploy portfolio to Timeweb

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portfolio
        run: npm run build

      - name: Check Timeweb destination
        id: destination
        env:
          TIMEWEB_FTP_DIR: ${{ vars.TIMEWEB_FTP_DIR }}
        run: |
          if [ -z "$TIMEWEB_FTP_DIR" ]; then
            echo "::error::Set the repository variable TIMEWEB_FTP_DIR to the website root directory on Timeweb."
            exit 1
          fi
          printf 'remote_dir=%s/\n' "${TIMEWEB_FTP_DIR%/}" >> "$GITHUB_OUTPUT"

      - name: Install MTR for network diagnostics
        run: |
          sudo apt-get update
          sudo apt-get install -y mtr-tiny iputils-ping dnsutils traceroute netcat-openbsd

      - name: Trace route to Timeweb
        run: |
          echo "=== Runner public IP ==="
          curl -4 -fsS https://api.ipify.org
          echo
          echo "=== IP PING ==="
          ping -c 4 92.53.96.150 || true
          echo "=== DNS ==="
          nslookup vh300.timeweb.ru || true
          echo "=== Traceroute ==="
          sudo traceroute -T vh300.timeweb.ru || true
          echo "=== Port 21 ==="
          nc -zv -w 5 vh300.timeweb.ru 21 || true
          echo "=== ICMP tracing (MTR) ==="
          sudo mtr --report-wide vh300.timeweb.ru || true
          echo "=== TCP tracing (MTR) ==="
          sudo mtr --report-wide --tcp vh300.timeweb.ru || true
          echo "=== TCP port 21 tracing (MTR) ==="
          sudo mtr --report-wide --tcp --port 21 vh300.timeweb.ru || true

      - name: Deploy dist to Timeweb over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.TIMEWEB_FTP_SERVER }}
          username: ${{ secrets.TIMEWEB_FTP_USERNAME }}
          password: ${{ secrets.TIMEWEB_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: dist/
          server-dir: ${{ steps.destination.outputs.remote_dir }}
          dry-run: false
